<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thanh Toán - Công Ty Du Lịch Đạt_Tùng_Đăng_Long</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script id="tailwind-config">
        tailwind.config = { 
            darkMode: "class",
            theme: { 
                extend: { 
                    colors: { 
                        "primary": "#002155", 
                        "secondary-container": "#fd6600",
                        "surface": "#f7f9fb"
                    }, 
                    fontFamily: { 
                        "headline": ["Be Vietnam Pro"], 
                        "body": ["Plus Jakarta Sans"] 
                    } 
                } 
            } 
        }
    </script>
    <script>
        
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-surface dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-body antialiased min-h-screen pb-20">

    <nav class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a class="text-xl font-black text-primary dark:text-blue-400 font-headline flex items-center gap-2" href="index.html">
                <span class="material-symbols-outlined">arrow_back</span> Trở về
            </a>
            <div class="text-lg font-bold text-slate-800 dark:text-white">Thanh Toán An Toàn <span class="material-symbols-outlined text-green-500 text-sm">lock</span></div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 md:px-6 mt-8">
        <div class="max-w-3xl mx-auto mb-10">
            <div class="flex items-center justify-between relative">
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-slate-200 dark:bg-slate-700 rounded-full z-0"></div>
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-1 bg-primary dark:bg-blue-500 rounded-full z-0 transition-all duration-500"></div>
                
                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold shadow-md"><span class="material-symbols-outlined text-sm">check</span></div>
                    <span class="text-xs font-bold mt-2 text-primary dark:text-blue-400">Giỏ hàng</span>
                </div>
                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold shadow-lg ring-4 ring-primary/20">2</div>
                    <span class="text-xs font-bold mt-2 text-primary dark:text-blue-400">Thanh toán</span>
                </div>
                <div class="relative z-10 flex flex-col items-center">
                    <div class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-600 text-slate-400 flex items-center justify-center font-bold">3</div>
                    <span class="text-xs font-medium mt-2 text-slate-400">Hoàn tất</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-7">
                <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-sm border border-slate-100 dark:border-slate-700">
                    <h2 class="text-2xl font-headline font-bold text-primary dark:text-white mb-6">Thông tin liên hệ</h2>
                    
                    <form id="checkout-form" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-2">Họ và tên *</label>
                                <input type="text" id="cus-name" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/20 dark:text-white transition-all" placeholder="VD: Nguyễn Văn A">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-2">Số điện thoại *</label>
                                <input type="tel" id="cus-phone" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/20 dark:text-white transition-all" placeholder="09xx xxx xxx">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-2">Email xác nhận *</label>
                            <input type="email" id="cus-email" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/20 dark:text-white transition-all" placeholder="email@example.com">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-2">Yêu cầu đặc biệt (Tùy chọn)</label>
                            <textarea id="cus-note" rows="3" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/20 dark:text-white transition-all" placeholder="Ghi chú về ăn uống, người cao tuổi..."></textarea>
                        </div>

                        <h2 class="text-2xl font-headline font-bold text-primary dark:text-white mt-8 mb-4 pt-6 border-t border-slate-100 dark:border-slate-700">Phương thức thanh toán</h2>
                        
                        <div class="space-y-3">
                            <label class="flex items-center p-4 border border-slate-200 dark:border-slate-600 rounded-xl cursor-pointer hover:bg-blue-50 dark:hover:bg-slate-700 transition-colors group relative overflow-hidden">
                                <input type="radio" name="payment" value="Chuyển khoản ngân hàng" checked class="w-5 h-5 text-primary focus:ring-primary">
                                <div class="ml-4 flex-1">
                                    <span class="block font-bold text-slate-800 dark:text-white">Chuyển khoản ngân hàng (Mã QR)</span>
                                    <span class="text-xs text-slate-500 dark:text-slate-400">Thanh toán nhanh chóng qua ứng dụng ngân hàng</span>
                                </div>
                                <span class="material-symbols-outlined text-slate-300 group-hover:text-primary transition-colors">qr_code_scanner</span>
                            </label>

                            <label class="flex items-center p-4 border border-slate-200 dark:border-slate-600 rounded-xl cursor-pointer hover:bg-blue-50 dark:hover:bg-slate-700 transition-colors group">
                                <input type="radio" name="payment" value="Thanh toán tại văn phòng" class="w-5 h-5 text-primary focus:ring-primary">
                                <div class="ml-4 flex-1">
                                    <span class="block font-bold text-slate-800 dark:text-white">Thanh toán tại văn phòng</span>
                                    <span class="text-xs text-slate-500 dark:text-slate-400">Giữ chỗ trước, thanh toán trực tiếp tại công ty</span>
                                </div>
                                <span class="material-symbols-outlined text-slate-300 group-hover:text-primary transition-colors">storefront</span>
                            </label>
                        </div>

                        <button type="submit" id="btn-submit" class="w-full mt-8 bg-secondary-container hover:bg-orange-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:shadow-orange-500/30 transition-all flex justify-center items-center gap-2 active:scale-[0.98]">
                            Xác nhận & Đặt Tour <span class="material-symbols-outlined text-xl">arrow_forward</span>
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-5">
                <div class="bg-primary dark:bg-slate-800 rounded-3xl p-8 shadow-xl text-white sticky top-28">
                    <h3 class="text-xl font-headline font-bold mb-6">Tóm tắt đơn hàng</h3>
                    
                    <div id="order-items" class="space-y-4 mb-6 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">
                        </div>

                    <div class="border-t border-white/20 pt-4 space-y-3">
                        <div class="flex justify-between text-blue-100 dark:text-slate-300 text-sm">
                            <span>Tạm tính</span>
                            <span id="sub-total" class="font-medium">0đ</span>
                        </div>
                        <div class="flex justify-between text-blue-100 dark:text-slate-300 text-sm">
                            <span>Phí xử lý giao dịch</span>
                            <span class="font-medium">Miễn phí</span>
                        </div>
                        <div class="flex justify-between items-end pt-4 mt-2 border-t border-white/20">
                            <span class="text-sm font-bold uppercase tracking-wider text-blue-200">Tổng cộng</span>
                            <span id="grand-total" class="text-3xl font-black text-white tracking-tight">0đ</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
    </style>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        let currentUser = null;
        let cartData = [];
        let totalAmount = 0;

        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('cus-email').value = user.email;
                document.getElementById('cus-email').readOnly = true;
                document.getElementById('cus-email').classList.add('opacity-70');
            }
        });

        
        function loadOrderSummary() {
            cartData = JSON.parse(localStorage.getItem('cart50cntt1')) || [];
            const container = document.getElementById('order-items');
            
            if (cartData.length === 0) {
                alert("Giỏ hàng của bạn đang trống! Vui lòng chọn tour trước khi thanh toán.");
                window.location.href = "tours.html";
                return;
            }

            container.innerHTML = '';
            totalAmount = 0;

            cartData.forEach(item => {
                const priceNum = parseInt(item.giaTour.replace(/\D/g, '')) || 0;
                const soLuong = parseInt(item.soLuong) || 1;
                const itemTotal = priceNum * soLuong;
                totalAmount += itemTotal;

                container.innerHTML += `
                    <div class="flex gap-4 bg-white/10 p-3 rounded-2xl">
                        <img src="${item.imageUrl}" class="w-16 h-16 rounded-xl object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm leading-tight line-clamp-2">${item.tenTour}</h4>
                            <div class="flex justify-between items-center mt-2 text-xs text-blue-200">
                                <span>SL: ${soLuong} | Khởi hành: ${item.ngayDi}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            const formatVND = (num) => num.toLocaleString('vi-VN') + 'đ';
            document.getElementById('sub-total').innerText = formatVND(totalAmount);
            document.getElementById('grand-total').innerText = formatVND(totalAmount);
        }

        
        loadOrderSummary();

        
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const btn = document.getElementById('btn-submit');
            
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span> Đang xử lý...`;
            btn.classList.replace('bg-secondary-container', 'bg-slate-500');

            try {
                
                const bookingData = {
                    uid: currentUser ? currentUser.uid : "GUEST", // Phân biệt khách vãng lai và tài khoản
                    email: document.getElementById('cus-email').value,
                    khachHang: {
                        ten: document.getElementById('cus-name').value,
                        sdt: document.getElementById('cus-phone').value,
                        ghiChu: document.getElementById('cus-note').value
                    },
                    phuongThucTT: document.querySelector('input[name="payment"]:checked').value,
                    tongTien: totalAmount,
                    chiTietTour: cartData,
                    trangThai: "Chờ xử lý",
                    ngayDat: new Date().toLocaleString('vi-VN')
                };

                
                await addDoc(collection(db, "bookings"), bookingData);

                
                var duration = 2.5 * 1000;
                var animationEnd = Date.now() + duration;
                var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

                function randomInRange(min, max) { return Math.random() * (max - min) + min; }

                var interval = setInterval(function() {
                    var timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) { return clearInterval(interval); }
                    var particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);

                
                btn.innerHTML = `<span class="material-symbols-outlined text-xl">check_circle</span> Đặt tour thành công!`;
                btn.classList.replace('bg-slate-500', 'bg-green-500');

                
                localStorage.removeItem('cart50cntt1');

                
                setTimeout(() => {
                    window.location.href = "profile.html"; 
                }, 2500);

            } catch (error) {
                console.error("Lỗi đặt tour:", error);
                alert("Rất tiếc! Đã có lỗi xảy ra. Vui lòng thử lại.");
                
                btn.disabled = false;
                btn.innerHTML = `Xác nhận & Đặt Tour <span class="material-symbols-outlined text-xl">arrow_forward</span>`;
                btn.classList.replace('bg-slate-500', 'bg-secondary-container');
            }
        });
    </script>
</body>
</html>
