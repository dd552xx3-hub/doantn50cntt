<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hồ Sơ Của Tôi - Công Ty Du Lịch Đạt_Tùng_Đăng_Long</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#002155", "secondary-container": "#fd6600", "background": "#f7f9fb" }, fontFamily: { "headline": ["Be Vietnam Pro"], "body": ["Plus Jakarta Sans"] } } } }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .dark .glass-header { background: rgba(15, 23, 42, 0.85); border-bottom-color: rgba(255,255,255,0.05); }
    </style>
    <script>if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); }</script>
</head>
<body class="bg-background dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-body antialiased transition-colors duration-500 pb-20">

    <nav class="fixed top-0 w-full z-50 glass-header transition-all duration-300">
        <div class="flex justify-between items-center px-6 md:px-8 max-w-7xl mx-auto h-20">
            <a class="text-xl font-black tracking-tighter text-primary dark:text-blue-400 font-headline" href="index.html">Đạt_Tùng_Đăng_Long<span class="text-secondary-container">.</span></a>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-all">
                    <span id="theme-toggle-dark-icon" class="hidden material-symbols-outlined text-primary dark:text-blue-400">dark_mode</span>
                    <span id="theme-toggle-light-icon" class="hidden material-symbols-outlined text-primary dark:text-blue-400">light_mode</span>
                </button>
                <button id="btn-logout" class="bg-red-50 hover:bg-red-100 dark:bg-red-900/30 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 px-5 py-2.5 rounded-full font-bold text-sm transition-all shadow-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">logout</span> Thoát
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-28">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <div class="lg:col-span-4">
                <div class="bg-white dark:bg-slate-800 rounded-[2.5rem] p-8 shadow-sm border border-slate-100 dark:border-slate-700 sticky top-28 text-center">
                    <div class="w-32 h-32 mx-auto bg-gradient-to-tr from-primary to-blue-400 rounded-full p-1 shadow-xl mb-6 relative">
                        <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" class="w-full h-full object-cover rounded-full border-4 border-white dark:border-slate-800">
                        <button class="absolute bottom-0 right-0 w-10 h-10 bg-secondary-container text-white rounded-full flex items-center justify-center border-4 border-white dark:border-slate-800 shadow-md hover:scale-110 transition-transform">
                            <span class="material-symbols-outlined text-[18px]">photo_camera</span>
                        </button>
                    </div>
                    <h2 id="prof-name" class="text-2xl font-black font-headline text-primary dark:text-white mb-1">Đang tải...</h2>
                    <p id="prof-email" class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-8">...</p>
                    
                    <div class="grid grid-cols-2 gap-4 border-t border-slate-100 dark:border-slate-700 pt-8">
                        <div class="text-center p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl">
                            <div class="text-3xl font-black text-primary dark:text-blue-400 mb-1" id="stat-tours">0</div>
                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tour đã đi</div>
                        </div>
                        <div class="text-center p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl">
                            <div class="text-3xl font-black text-secondary-container mb-1">0</div>
                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Điểm thưởng</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div id="next-trip-card" class="hidden bg-gradient-to-r from-primary to-blue-800 rounded-[2.5rem] p-8 shadow-xl text-white mb-10 relative overflow-hidden">
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 text-blue-200 text-sm font-bold uppercase tracking-widest mb-4">
                            <span class="material-symbols-outlined animate-pulse text-secondary-container">flight_takeoff</span> Chuyến đi tiếp theo
                        </div>
                        <h3 id="next-trip-name" class="text-2xl md:text-3xl font-black font-headline mb-8 line-clamp-1">...</h3>
                        <div class="grid grid-cols-4 gap-4 max-w-md">
                            <div class="bg-white/10 backdrop-blur rounded-2xl p-3 text-center border border-white/20">
                                <div id="cd-days" class="text-3xl font-black">00</div>
                                <div class="text-[9px] uppercase tracking-widest opacity-80 mt-1">Ngày</div>
                            </div>
                            <div class="bg-white/10 backdrop-blur rounded-2xl p-3 text-center border border-white/20">
                                <div id="cd-hours" class="text-3xl font-black">00</div>
                                <div class="text-[9px] uppercase tracking-widest opacity-80 mt-1">Giờ</div>
                            </div>
                            <div class="bg-white/10 backdrop-blur rounded-2xl p-3 text-center border border-white/20">
                                <div id="cd-mins" class="text-3xl font-black">00</div>
                                <div class="text-[9px] uppercase tracking-widest opacity-80 mt-1">Phút</div>
                            </div>
                            <div class="bg-white/10 backdrop-blur rounded-2xl p-3 text-center border border-white/20">
                                <div id="cd-secs" class="text-3xl font-black">00</div>
                                <div class="text-[9px] uppercase tracking-widest opacity-80 mt-1">Giây</div>
                            </div>
                        </div>
                    </div>
                    <span class="material-symbols-outlined absolute -bottom-10 -right-10 text-[200px] text-white/5 rotate-12">luggage</span>
                </div>

                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-3xl font-black font-headline text-primary dark:text-white">Lịch sử đặt Tour</h2>
                </div>

                <div id="booking-list" class="space-y-6">
                    <div class="text-center py-20 text-slate-400 bg-white dark:bg-slate-800 rounded-[2rem] border border-slate-100 dark:border-slate-700 border-dashed">
                        <span class="material-symbols-outlined animate-spin text-4xl mb-3">progress_activity</span>
                        <p class="font-medium">Đang tải dữ liệu chuyến đi...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { collection, query, where, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        let countdownInterval;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('prof-email').innerText = user.email;
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) { document.getElementById('prof-name').innerText = userDoc.data().name; } 
                    else { document.getElementById('prof-name').innerText = user.email.split('@')[0]; }
                } catch (e) { document.getElementById('prof-name').innerText = user.email.split('@')[0]; }
                loadBookings(user.email);
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => { signOut(auth); });

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        if (document.documentElement.classList.contains('dark')) { themeToggleLightIcon.classList.remove('hidden'); } else { themeToggleDarkIcon.classList.remove('hidden'); }
        themeToggleBtn.addEventListener('click', () => {
            themeToggleDarkIcon.classList.toggle('hidden'); themeToggleLightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) { document.documentElement.classList.remove('dark'); localStorage.setItem('color-theme', 'light'); } 
            else { document.documentElement.classList.add('dark'); localStorage.setItem('color-theme', 'dark'); }
        });

        async function loadBookings(email) {
            const container = document.getElementById('booking-list');
            try {
                const q = query(collection(db, "bookings"), where("email", "==", email));
                const snap = await getDocs(q);
                
                container.innerHTML = "";
                document.getElementById('stat-tours').innerText = snap.size;

                if (snap.empty) {
                    container.innerHTML = `
                        <div class="text-center py-20 bg-white dark:bg-slate-800 rounded-[2.5rem] border border-slate-100 dark:border-slate-700 shadow-sm">
                            <span class="material-symbols-outlined text-6xl text-slate-300 mb-4">explore</span>
                            <h3 class="text-xl font-bold mb-2">Bạn chưa có chuyến đi nào</h3>
                            <p class="text-slate-500 mb-6">Hãy bắt đầu hành trình đầu tiên cùng chúng tôi!</p>
                            <a href="tours.html" class="inline-flex bg-primary text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-800 transition-colors shadow-lg">Khám phá Tour ngay</a>
                        </div>`;
                    return;
                }

                let nextTripDate = null;
                let nextTripName = "";

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const bId = docSnap.id;
                    const items = data.chiTietTour || [];
                    const firstTour = items[0] || {};
                    
                    let statusColor = "bg-yellow-100 text-yellow-700";
                    let statusIcon = "schedule";
                    if(data.trangThai === "Đã xác nhận") { statusColor = "bg-green-100 text-green-700"; statusIcon = "check_circle"; }
                    if(data.trangThai === "Đã hoàn thành") { statusColor = "bg-blue-100 text-blue-700"; statusIcon = "verified"; }
                    if(data.trangThai === "Đã hủy" || data.trangThai === "Yêu cầu hủy") { statusColor = "bg-red-100 text-red-700"; statusIcon = "cancel"; }

                    // Logic TÌM CHUYẾN ĐI TIẾP THEO (cho Countdown)
                    if(data.trangThai === "Đã xác nhận" && firstTour.ngayDi) {
                        const parts = firstTour.ngayDi.split('/');
                        if(parts.length === 3) {
                            const tripD = new Date(`${parts[2]}-${parts[1]}-${parts[0]}T00:00:00`);
                            if(tripD > new Date()) {
                                if(!nextTripDate || tripD < nextTripDate) {
                                    nextTripDate = tripD;
                                    nextTripName = firstTour.tenTour;
                                }
                            }
                        }
                    }

                    // HIỂN THỊ NÚT "YÊU CẦU HỦY" TÍNH NĂNG MỚI (Chỉ hiện khi đang Chờ xử lý / Chờ xác nhận)
                    let cancelBtnHtml = "";
                    if(data.trangThai === "Chờ xử lý" || data.trangThai === "Chờ xác nhận") {
                        cancelBtnHtml = `<button onclick="requestCancel('${bId}')" class="text-xs font-bold text-red-500 hover:text-red-700 transition-colors flex items-center gap-1 border border-red-200 bg-red-50 px-3 py-1.5 rounded-lg"><span class="material-symbols-outlined text-[14px]">close</span> Yêu cầu hủy</button>`;
                    }

                    let itemsHtml = items.map(i => `
                        <div class="flex items-center gap-4 py-3 border-t border-slate-50 dark:border-slate-700/50 mt-3">
                            <img src="${i.imageUrl}" class="w-16 h-16 rounded-xl object-cover shadow-sm">
                            <div class="flex-1">
                                <h4 class="font-bold text-slate-800 dark:text-white line-clamp-1">${i.tenTour}</h4>
                                <p class="text-xs text-slate-500">Khởi hành: ${i.ngayDi}</p>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-primary dark:text-blue-400">${i.giaTour}</div>
                                <div class="text-xs text-slate-400">x${i.soLuong} khách</div>
                            </div>
                        </div>`).join('');

                    container.innerHTML += `
                        <div class="bg-white dark:bg-slate-800 rounded-[2rem] p-6 shadow-sm border border-slate-100 dark:border-slate-700 hover:shadow-md transition-shadow">
                            <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
                                <div>
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Mã Đơn</span>
                                    <div class="font-mono font-bold text-sm">#${bId.substring(0,8).toUpperCase()}</div>
                                </div>
                                <div class="${statusColor} px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5">
                                    <span class="material-symbols-outlined text-[16px]">${statusIcon}</span> ${data.trangThai}
                                </div>
                            </div>
                            ${itemsHtml}
                            <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-700 flex flex-wrap justify-between items-center gap-4">
                                <div>
                                    <span class="text-xs text-slate-500 block mb-1">Tổng thanh toán</span>
                                    <span class="text-2xl font-black text-secondary-container">${data.tongTien.toLocaleString('vi-VN')}đ</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    ${cancelBtnHtml}
                                    <button class="bg-primary hover:bg-blue-800 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-colors">Xem chi tiết</button>
                                </div>
                            </div>
                        </div>`;
                });

                if(nextTripDate) { startCountdown(nextTripDate, nextTripName); } 
                else { document.getElementById('next-trip-card').classList.add('hidden'); clearInterval(countdownInterval); }

            } catch (error) {
                console.error(error);
                container.innerHTML = "<p class='text-center py-10 text-red-500 font-bold'>Lỗi tải dữ liệu. Vui lòng thử lại.</p>";
            }
        }

        // HÀM XỬ LÝ YÊU CẦU HỦY TÍNH NĂNG MỚI
        window.requestCancel = async function(bookingId) {
            if(confirm("Bạn có chắc chắn muốn gửi yêu cầu hủy Tour này? (Admin sẽ xét duyệt yêu cầu)")) {
                try {
                    await updateDoc(doc(db, "bookings", bookingId), { trangThai: "Yêu cầu hủy" });
                    alert("Đã gửi yêu cầu hủy thành công!");
                    loadBookings(auth.currentUser.email); // Reload lại danh sách
                } catch (error) {
                    alert("Lỗi khi gửi yêu cầu hủy!");
                }
            }
        };

        function startCountdown(targetDate, tourName) {
            document.getElementById('next-trip-card').classList.remove('hidden');
            document.getElementById('next-trip-name').innerText = tourName;
            
            if(countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetDate.getTime() - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('next-trip-name').innerText = "Hành trình đang diễn ra!";
                    document.getElementById('cd-days').innerText = "00";
                    document.getElementById('cd-hours').innerText = "00";
                    document.getElementById('cd-mins').innerText = "00";
                    document.getElementById('cd-secs').innerText = "00";
                    return;
                }

                const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('cd-days').innerText = d.toString().padStart(2, '0');
                document.getElementById('cd-hours').innerText = h.toString().padStart(2, '0');
                document.getElementById('cd-mins').innerText = m.toString().padStart(2, '0');
                document.getElementById('cd-secs').innerText = s.toString().padStart(2, '0');
            }, 1000);
        }
    </script>
</body>
</html>
