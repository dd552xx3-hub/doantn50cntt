<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chi Tiết Tour - Đạt_Tùng_Đăng_Long Travel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = { 
            darkMode: "class",
            theme: { 
                extend: { 
                    colors: { "primary": "#002155", "secondary-container": "#fd6600", "background": "#f7f9fb" }, 
                    fontFamily: { "headline": ["Be Vietnam Pro"], "body": ["Plus Jakarta Sans"] } 
                } 
            } 
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .goog-te-gadget { font-family: 'Plus Jakarta Sans', sans-serif !important; color: transparent !important; }
        .goog-te-gadget .goog-te-combo { margin: 0; padding: 4px 8px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 12px; outline: none; background: white; color: #1e293b; cursor: pointer; }
        .dark .goog-te-gadget .goog-te-combo { background: #1e293b; color: white; border-color: #334155; }
        .goog-logo-link, .goog-te-gadget span { display: none !important; }
        body { top: 0px !important; }
    </style>
</head>
<body class="bg-background dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-body antialiased min-h-screen transition-colors duration-500 pt-20">

    <nav class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/50 dark:border-slate-800 shadow-sm transition-all duration-300">
        <div class="flex justify-between items-center px-8 h-20 max-w-[1280px] mx-auto">
            <a class="text-xl font-black tracking-tighter text-primary dark:text-blue-400 font-headline" href="index.html">Đạt_Tùng_Đăng_Long<span class="text-secondary-container">.</span></a>
            <div class="hidden md:flex gap-8 font-headline text-sm font-medium">
                <a class="text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-blue-400" href="index.html">Trang chủ</a>
                <a class="text-primary dark:text-blue-400 border-b-2 border-primary dark:border-blue-400" href="tours.html">Tour</a>
                <a class="text-slate-600 dark:text-slate-300 hover:text-primary dark:hover:text-blue-400" href="destinations.html">Điểm đến</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="cart.html" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-all relative">
                    <span class="material-symbols-outlined text-primary dark:text-blue-400">shopping_cart</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-[1280px] mx-auto px-6 py-8" id="tour-content">
        <div id="skeleton-loader" class="animate-pulse">
            <div class="h-10 bg-slate-200 dark:bg-slate-800 rounded w-1/3 mb-6"></div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="md:col-span-3 h-[400px] bg-slate-200 dark:bg-slate-800 rounded-[2rem]"></div>
                <div class="hidden md:flex flex-col gap-4">
                    <div class="h-[125px] bg-slate-200 dark:bg-slate-800 rounded-2xl"></div>
                    <div class="h-[125px] bg-slate-200 dark:bg-slate-800 rounded-2xl"></div>
                    <div class="h-[125px] bg-slate-200 dark:bg-slate-800 rounded-2xl"></div>
                </div>
            </div>
        </div>

        <div id="real-content" class="hidden opacity-0 transition-opacity duration-500">
            <div class="mb-6">
                <span id="detail-category" class="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest mb-3 inline-block">Danh mục</span>
                <h1 id="detail-title" class="text-3xl md:text-5xl font-black text-primary dark:text-white font-headline leading-tight">Đang tải...</h1>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
                <div class="md:col-span-3 h-[300px] md:h-[500px] rounded-[2rem] overflow-hidden shadow-sm">
                    <img id="main-image" src="" class="w-full h-full object-cover hover:scale-105 transition-transform duration-700 cursor-pointer">
                </div>
                <div class="hidden md:flex flex-col gap-4 h-[500px]">
                    <img id="sub-image-1" src="https://images.unsplash.com/photo-1528127269322-539801943592?q=80&w=600&auto=format&fit=crop" class="w-full h-1/3 object-cover rounded-2xl shadow-sm hover:opacity-80 transition-opacity">
                    <img id="sub-image-2" src="https://images.unsplash.com/photo-1559592413-7cec4d0cae2b?q=80&w=600&auto=format&fit=crop" class="w-full h-1/3 object-cover rounded-2xl shadow-sm hover:opacity-80 transition-opacity">
                    <div class="w-full h-1/3 relative rounded-2xl overflow-hidden shadow-sm cursor-pointer group">
                        <img id="sub-image-3" src="https://images.unsplash.com/photo-1542010589005-d1eacc3918f2?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                            <span class="text-white font-bold text-lg">+ Xem thêm</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                <div class="lg:col-span-2 space-y-8">
                    <div class="flex flex-wrap gap-4 border-b border-slate-100 dark:border-slate-800 pb-6">
                        <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 px-4 py-2 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-300">
                            <span class="material-symbols-outlined text-secondary-container">schedule</span> <span id="detail-time">3 Ngày 2 Đêm</span>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 px-4 py-2 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-300">
                            <span class="material-symbols-outlined text-secondary-container">directions_car</span> Phương tiện: Ô tô
                        </div>
                        <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 px-4 py-2 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-300">
                            <span class="material-symbols-outlined text-secondary-container">hotel</span> Khách sạn 4 sao
                        </div>
                    </div>

                    <div>
                        <h2 class="text-2xl font-bold text-primary dark:text-white mb-4">Điểm nhấn Hành trình</h2>
                        <p id="detail-desc" class="text-slate-600 dark:text-slate-400 leading-relaxed">Đang cập nhật nội dung...</p>
                    </div>
                </div>

                <div class="lg:col-span-1">
                    <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-[2rem] p-8 shadow-xl sticky top-28">
                        <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-2">Giá ưu đãi</p>
                        <h3 id="detail-price" class="text-4xl font-black text-secondary-container mb-6">Đang tải...</h3>
                        
                        <div class="space-y-4 mb-8">
                            <div>
                                <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">Ngày khởi hành</label>
                                <input type="date" id="book-date" class="w-full mt-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 outline-none dark:text-white">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">Số lượng khách</label>
                                <div class="flex items-center justify-between mt-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2">
                                    <button onclick="changeQty(-1)" class="w-8 h-8 rounded-full bg-white dark:bg-slate-700 flex items-center justify-center font-bold shadow-sm">-</button>
                                    <span id="book-qty" class="font-black text-lg">1</span>
                                    <button onclick="changeQty(1)" class="w-8 h-8 rounded-full bg-white dark:bg-slate-700 flex items-center justify-center font-bold shadow-sm">+</button>
                                </div>
                            </div>
                        </div>

                        <button id="btn-add-cart" class="w-full bg-primary dark:bg-blue-600 text-white py-4 rounded-full font-bold shadow-lg hover:opacity-90 transition-all flex items-center justify-center gap-2 active:scale-95">
                            <span class="material-symbols-outlined">shopping_cart</span> Đặt Tour Ngay
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Hàm tăng giảm số lượng
        window.changeQty = function(val) {
            let qty = parseInt(document.getElementById('book-qty').innerText);
            qty += val;
            if (qty < 1) qty = 1;
            document.getElementById('book-qty').innerText = qty;
        }

        async function loadTourDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const tourId = urlParams.get('id');

            if (!tourId) {
                alert("Không tìm thấy mã Tour!");
                window.location.href = "tours.html";
                return;
            }

            try {
                const docRef = doc(db, "tours", tourId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Lắp dữ liệu vào HTML
                    document.getElementById('detail-title').innerText = data.tenTour;
                    document.getElementById('detail-category').innerText = data.loaiTour || "Khám phá";
                    document.getElementById('detail-price').innerText = data.giaTour;
                    document.getElementById('detail-time').innerText = data.thoiGian || "Đang cập nhật";
                    document.getElementById('detail-desc').innerText = data.moTa || "Hãy cùng chúng tôi trải nghiệm chuyến đi tuyệt vời này.";
                    
                    // Xử lý ảnh chính
                    document.getElementById('main-image').src = data.imageUrl;

                    // Ẩn khung xương, hiện nội dung
                    document.getElementById('skeleton-loader').style.display = 'none';
                    const realContent = document.getElementById('real-content');
                    realContent.classList.remove('hidden');
                    setTimeout(() => realContent.classList.remove('opacity-0'), 50);

                    // Xử lý nút Thêm vào giỏ hàng
                    document.getElementById('btn-add-cart').addEventListener('click', () => {
                        const date = document.getElementById('book-date').value;
                        if (!date) {
                            alert("Vui lòng chọn ngày khởi hành!");
                            return;
                        }

                        const cartItem = {
                            id: tourId,
                            tenTour: data.tenTour,
                            giaTour: data.giaTour,
                            imageUrl: data.imageUrl,
                            soLuong: parseInt(document.getElementById('book-qty').innerText),
                            ngayDi: date
                        };

                        let cart = JSON.parse(localStorage.getItem('cart50cntt1')) || [];
                        cart.push(cartItem);
                        localStorage.setItem('cart50cntt1', JSON.stringify(cart));
                        
                        alert("Đã thêm vào giỏ hàng thành công!");
                        window.location.href = "cart.html";
                    });

                } else {
                    alert("Tour này không tồn tại hoặc đã bị xóa.");
                    window.location.href = "tours.html";
                }
            } catch (error) {
                console.log("Lỗi:", error);
                alert("Lỗi tải dữ liệu. Vui lòng thử lại.");
            }
        }

        loadTourDetail();
    </script>
</body>
</html>
